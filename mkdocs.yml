site_name: SODA Docs
site_description: Operator documentation for the SODA tabletop dual-arm robot.
site_url: https://somarobotics.github.io/soda-docs/
repo_url: https://github.com/somarobotics/soda-docs
edit_uri: ""

theme:
  name: material
  font: false  # system fonts — no Google Fonts CDN (keeps the site fast everywhere)
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/motion.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Safety: safety.md
  - Operate:
      - Control Modes: control-modes.md
      - CLI Reference: soda-cli-reference.md
      - Operating Guidelines: operating-guidelines.md
      - Software Updates: updates.md
  - Your Policy:
      - Run Your Policy: running-your-policy.md
      - Serving Contract: policy-serving.md
  - Collect Data:
      - Teleop & Recording: data-collection-teleop.md
      - DAgger Corrections: dagger.md
      - Quest Headset Setup: quest-setup.md
      - Where Recordings Go: recordings.md
  - Reference:
      - Specifications: specifications.md
      - Glossary: glossary.md
      - Integration & Handover: shipped-docs.md
